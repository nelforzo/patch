<!DOCTYPE html><html lang="en"><head><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1"><title>patch</title><style>
:root{color-scheme:light}
#content{white-space:pre-wrap}
textarea,input{font:inherit;width:100%}
@media(max-width:620px){textarea,input{min-height:44px}}
</style></head>
<body><basefont face="monospace">
<b>patch</b>
<p id=view><span id=content></span></p>
<textarea id=editor rows=7 hidden></textarea>
<font id=hint size=1 hidden></font>
<input type=button id=btn value=edit onclick=e()>
<div hidden id=patch>hi</div>
<script>
(function(){
var P="p1:",M=1450,c=document.getElementById("patch").textContent;
function $i(s){return document.getElementById(s)}
function b64(u){var b="",i;for(i=0;i<u.length;i++)b+=String.fromCharCode(u[i]);return btoa(b).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"")}
function base(){try{return parent.location.href.split("#")[0].split("?")[0]}catch(e){return location.href.split("#")[0].split("?")[0]}}
function slug(t){var s=(t||"").replace(/\s+/g," ").trim();return s.length>28?s.slice(0,28)+"…":s}
function tt(){var t=c?"patch - "+slug(c):"patch";document.title=t;try{parent.document.title=t}catch(e){}}
function rc(){var e=c.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");$i("content").innerHTML=e.replace(/(https?:\/\/[^\s<]+)/g,'<a href="$1" target="_blank">$1</a>')}
window.e=function(){var e=$i("editor");e.value=c;e.hidden=0;var b=$i("btn");b.value="save";b.onclick=s;$i("view").hidden=1;$i("hint").innerHTML="max "+M;$i("hint").hidden=0;e.focus()}
window.s=function(){var v=$i("editor").value;if(v.length>M){$i("hint").innerHTML="max "+M;return}c=v;$i("patch").textContent=c;rc();tt();var b=$i("btn");b.value="edit";b.onclick=e;$i("editor").hidden=1;$i("view").hidden=0;$i("hint").hidden=1;(async function(){var h="<!DOCTYPE html>\n"+document.documentElement.outerHTML,cs=new CompressionStream("deflate-raw"),g=cs.writable.getWriter(),ch=[],n=0;g.write(new TextEncoder().encode(h));g.close();var rd=cs.readable.getReader(),x;for(;;){x=await rd.read();if(x.done)break;ch.push(x.value);n+=x.value.length}var o=new Uint8Array(n),p=0,i;for(i=0;i<ch.length;i++){o.set(ch[i],p);p+=ch[i].length}parent.location.href=base()+"?v="+Date.now()+"#"+P+b64(o)})()}
rc();tt();
})()
</script></body></html>
